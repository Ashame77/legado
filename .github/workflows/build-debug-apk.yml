name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      clean:
        description: '清理后重新构建（跳过增量缓存，排查诡异构建失败时使用）'
        type: boolean
        default: false

# 最小权限，收敛 GITHUB_TOKEN 的权限范围
permissions:
  contents: read

# 同一 ref 重复触发时取消旧任务，避免并发写缓存 / 抢占 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 统一 shell：bash + -e + pipefail，防止管道中间失败被静默吞掉
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

env:
  # 缓解依赖下载的网络抖动：连接/读超时 + 重试 + 退避
  GRADLE_OPTS: >-
    -Dorg.gradle.internal.http.connectionTimeout=60000
    -Dorg.gradle.internal.http.socketTimeout=120000
    -Dorg.gradle.internal.repository.max.retries=5
    -Dorg.gradle.internal.repository.initial.backoff=500
  CLEAN_BUILD: ${{ inputs.clean }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # 防止 Gradle 卡死一直占用默认的 6 小时

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # 完整历史：构建脚本用 git describe / tag 生成版本号时不会失败
          # lfs: true   # 若仓库或子模块使用 Git LFS，取消此行注释

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # 不要在这里设 cache: gradle —— 缓存统一交给 setup-gradle，避免两套缓存互相打架

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper # 预装 wrapper 指定版本，避免构建时才下载 Gradle 发行版
          validate-wrappers: true # 校验 gradle-wrapper.jar 完整性（自定义 wrapper 时改为 false）

      - name: Configure Gradle runtime
        run: |
          # 写到 GRADLE_USER_HOME，不动仓库内的 gradle.properties：
          #  1) 不弄脏工作区（git describe 之类不会带 -dirty，也不会误提交）
          #  2) 不会因原文件末尾缺换行，把属性粘成一行导致解析失败
          #  3) 不会与项目里已有的 org.gradle.jvmargs 重复定义 / 覆盖掉原有 JVM 参数
          # 注意：此文件优先级高于项目 gradle.properties；若项目自定义了
          # org.gradle.jvmargs（如 --add-opens），请把必要参数合并到下面这行。
          GRADLE_USER_HOME="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$GRADLE_USER_HOME"
          cat > "$GRADLE_USER_HOME/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.workers.max=2
          org.gradle.caching=true
          kotlin.daemon.jvm.options=-Xmx1536m -Dfile.encoding=UTF-8
          EOF
          echo "Gradle runtime config written to $GRADLE_USER_HOME/gradle.properties"

      - name: Build With Gradle
        timeout-minutes: 30
        run: |
          test -f gradlew || { echo "::error::gradlew 不存在，请检查仓库"; exit 1; }
          chmod +x gradlew
          ./gradlew --version # 日志里留下 JDK / Gradle 版本，便于事后排错
          args=(:app:assembleDebug --stacktrace --no-daemon --no-configuration-cache)
          # 只构建 app 模块，避免其他模块的 debug 任务失败拖垮整个构建
          # 若模块名不是 :app，改回 assembleDebug
          if [[ "${CLEAN_BUILD:-false}" == "true" ]]; then
            ./gradlew clean "${args[@]}"
          else
            ./gradlew "${args[@]}"
          fi

      - name: Collect APK
        run: |
          APK_DIR="$GITHUB_WORKSPACE/apk"
          mkdir -p "$APK_DIR"
          # 原写法 app/build/outputs/apk/*/*/*.apk 要求三层目录，
          # 而 AGP 无 flavor 时实际是 apk/debug/*.apk（两层），glob 不匹配会让 cp 直接报错。
          # 用 find 兼容「有/无 flavor」「多模块」各种层级，且只收普通文件。
          mapfile -t apks < <(find "$GITHUB_WORKSPACE" \
                                 -type f -name '*.apk' \
                                 -path '*/build/outputs/apk/*' \
                                 ! -name '*-unsigned.apk')
          if (( ${#apks[@]} == 0 )); then
            echo "::error::未找到任何 APK，构建产物缺失"
            find "$GITHUB_WORKSPACE" -maxdepth 6 -type d -name outputs -print || true
            exit 1
          fi
          for apk in "${apks[@]}"; do
            name="$(basename "$apk")"
            # 同名时把 apk/ 之后的相对路径扁平化成文件名，保证不同 flavor / 模块不互相覆盖
            if [[ -e "$APK_DIR/$name" ]]; then
              name="${apk#*/build/outputs/apk/}"
              name="${name//\//_}"
            fi
            cp -f "$apk" "$APK_DIR/$name"
          done
          # 兜底校验：落地数量必须与源数量一致，杜绝静默覆盖
          copied="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | wc -l)"
          if (( copied != ${#apks[@]} )); then
            echo "::error::APK 收集数量不一致（源 ${#apks[@]} / 落地 $copied）"
            exit 1
          fi
          echo "收集到 ${copied} 个 APK："
          ls -lh "$APK_DIR"

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado_debug
          path: apk/*.apk # 相对路径即可，避免 ${{ }} 插值进 shell
          if-no-files-found: error # 默认 warn 会造成「构建成功但没产物」，必须显式报错
          retention-days: 14
          compression-level: 0 # APK 本身已是 zip，二次压缩只浪费时间

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "::group::Gradle daemon log (tail)"
          find "$HOME/.gradle/daemon" -type f -name 'daemon-*.out.log' \
               -exec tail -n 150 {} \; 2>/dev/null || true
          echo "::endgroup::"
          find "$GITHUB_WORKSPACE" -type f \( -name 'hs_err_pid*.log' -o -name '*.hprof' \) -print 2>/dev/null || true

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_id }}
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
            apk/**
          if-no-files-found: ignore
          retention-days: 7
