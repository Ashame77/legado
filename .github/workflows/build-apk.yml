name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - product: app
            task: assembleAppDebug
          - product: google
            task: assembleGoogleDebug
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build With Gradle
        run: |
          echo "开始进行 ${{ matrix.product }} debug 构建"
          chmod +x gradlew
          ./gradlew ${{ matrix.task }} --build-cache --parallel --daemon --warning-mode all

      - name: Collect APK
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          cp -rf ${{ github.workspace }}/app/build/outputs/apk/*/*/*.apk ${{ github.workspace }}/apk/

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado_${{ matrix.product }}_debug
          path: ${{ github.workspace }}/apk/*.apk
